<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startseite</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

        body {
            font-family: 'Pacifico', cursive, sans-serif;
            text-align: center;
            background-color: #ffe4e1;
            color: #ff1493;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .action-button {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 1.5em;
            cursor: pointer;
            font-family: 'Pacifico', cursive, sans-serif;
            text-decoration: none;
            display: inline-block;
            width: 220px;
        }

        .action-button:hover {
            background-color: #ff1493;
        }
    </style>
</head>
<body>

<h1>Kuchenrezepte mir Elena</h1>

<div class="button-container">
    <a href="login.jsp" class="action-button">🎀 Einloggen 🎀</a>
    <a href="register.jsp" class="action-button">🎀 Registrieren 🎀</a>
</div>

</body>
</html>
